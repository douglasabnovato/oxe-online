# CI: lint, testes, build e Playwright em PR e push; publicação no GitHub Pages só na main (push ou "Run workflow") e com a variável PAGES_VIA_ACTIONS=true, depois do build verde
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main, 'developer/**']

permissions:
  contents: read

jobs:
  raiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      # Artefato do Pages só na main (push ou "Run workflow") e com o Pages ligado pelo responsável
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.PAGES_VIA_ACTIONS == 'true'
        with:
          path: build

  # Publicação: só na main (push ou "Run workflow"), só com a variável PAGES_VIA_ACTIONS=true (criada pelo responsável ao ligar o Pages) e só depois do job raiz verde
  deploy:
    needs: raiz
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.PAGES_VIA_ACTIONS == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
